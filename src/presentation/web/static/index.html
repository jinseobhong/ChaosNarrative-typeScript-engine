<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abyss Empire — Minimal Prototype (캐릭터 생성 & 대화창)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
            mono: ['Fira Code', 'monospace']
          },
          colors: {
            abyss: {
              950: '#06070a',
              900: '#0b0e14',
              850: '#11151f',
              800: '#171c28',
              accent: '#e02b5e',
              gold: '#e6a84d',
              violet: '#9d4edd',
              cyan: '#00f0ff'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: #08090d;
      color: #e2e8f0;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(224, 43, 94, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans">

  <!-- 1. Top Bar -->
  <header class="h-14 border-b border-white/10 bg-abyss-900 px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-abyss-accent/20 border border-abyss-accent/40 flex items-center justify-center text-abyss-accent font-bold text-sm">
        💎
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-wider text-white">ABYSS EMPIRE MVP</h1>
        <p class="text-[10px] text-gray-400 font-mono">캐릭터 생성 & 고밀도 롤플레이 대화창</p>
      </div>
    </div>

    <!-- Active Character Selector Pills -->
    <div class="flex items-center gap-2" id="character-pills-container">
      <!-- Injected by JS -->
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <button onclick="showCreateCharacterModal()" class="px-3 py-1.5 rounded-lg bg-abyss-accent hover:bg-rose-600 text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-lg shadow-abyss-accent/20">
        <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
        <span>+ 캐릭터 생성</span>
      </button>
      <button onclick="undoTurn()" class="px-3 py-1.5 rounded-lg border border-white/10 hover:bg-white/5 text-gray-300 text-xs flex items-center gap-1.5 transition">
        <i data-lucide="undo-2" class="w-3.5 h-3.5"></i>
        <span>Undo 롤백</span>
      </button>
    </div>
  </header>

  <!-- 2. Main Viewport (2-Column Flat Layout: Left Character Portrait & Stats, Right Dialogue Stream) -->
  <main class="flex-1 grid grid-cols-12 gap-4 p-4 overflow-hidden relative">

    <!-- LEFT: Character Info & Visual (Cols 1-4) -->
    <section class="col-span-4 flex flex-col gap-3 overflow-hidden bg-abyss-900 rounded-2xl border border-white/10 p-4">
      <div class="relative flex-1 w-full rounded-xl overflow-hidden bg-black/40 border border-white/5 flex items-center justify-center">
        <img id="char-portrait-img" src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=80" alt="Portrait" class="w-full h-full object-cover object-top">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30"></div>
        
        <!-- Status Overlay -->
        <div class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-black/70 backdrop-blur-md border border-white/10 text-[11px] font-mono font-bold text-rose-300" id="char-stage-badge">
          Stage 1 (탄성 저항)
        </div>
        <div class="absolute top-3 right-3 px-2 py-0.5 rounded bg-black/70 border border-white/10 text-[10px] font-mono text-gray-400" id="char-seed-badge">
          #LILI-70G-BFFF
        </div>

        <div class="absolute bottom-3 left-3 right-3">
          <div class="text-xs font-semibold text-abyss-gold" id="char-title-text">제1황녀 • 제국 황실</div>
          <div class="text-lg font-bold text-white flex items-center justify-between">
            <span id="char-name-text">릴리스</span>
            <span class="text-xs px-2 py-0.5 rounded bg-abyss-accent/20 border border-abyss-accent/40 text-abyss-accent font-mono" id="char-armor-text">RIGID</span>
          </div>
        </div>
      </div>

      <!-- Ego Resilience Gauge -->
      <div class="p-3 bg-black/40 rounded-xl border border-white/5 flex flex-col gap-2">
        <div class="flex justify-between text-xs">
          <span class="text-rose-300 font-medium flex items-center gap-1"><i data-lucide="shield" class="w-3.5 h-3.5"></i> 에고 자아 내구도</span>
          <span class="font-mono text-rose-400" id="ego-val">100.0%</span>
        </div>
        <div class="w-full h-2 rounded-full bg-black/60 overflow-hidden">
          <div id="ego-bar-fill" class="h-full bg-gradient-to-r from-rose-600 to-amber-400 transition-all duration-300" style="width: 100%;"></div>
        </div>
      </div>
    </section>

    <!-- RIGHT: Live Dialogue Chat Stream & Tactical Levers (Cols 5-12) -->
    <section class="col-span-8 flex flex-col bg-abyss-900 rounded-2xl border border-white/10 overflow-hidden">
      <!-- Chat Header -->
      <div class="h-11 border-b border-white/10 px-4 flex items-center justify-between bg-black/30 shrink-0">
        <span class="text-xs font-semibold text-gray-300 flex items-center gap-2">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-abyss-gold"></i>
          <span>실시간 서사 롤플레이</span>
        </span>
        <span class="text-[10px] font-mono text-gray-400" id="turn-counter">TURN 1</span>
      </div>

      <!-- Dialogue Stream -->
      <div class="flex-1 p-4 overflow-y-auto custom-scroll flex flex-col gap-3.5" id="dialogue-stream">
        <!-- Message bubbles injected by JS -->
      </div>

      <!-- Real-time Loading Feedback Banner (~하는 중입니다) -->
      <div id="loading-feedback-bar" class="hidden px-4 py-2.5 bg-abyss-accent/15 border-t border-b border-abyss-accent/30 flex items-center justify-between text-xs text-rose-200 shrink-0">
        <div class="flex items-center gap-2 font-medium">
          <svg class="animate-spin h-4 w-4 text-abyss-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span id="loading-feedback-text">릴리스가 생각을 정리하고 서사를 작성하는 중입니다...</span>
        </div>
        <span class="text-[10px] font-mono text-rose-300/70">LLM Processing</span>
      </div>

      <!-- 5 Tactical Choices (Single-click Levers) -->
      <div class="p-3 border-t border-white/10 bg-black/20 flex flex-col gap-2 shrink-0">
        <div class="text-[11px] font-semibold text-gray-400 flex items-center justify-between mb-0.5">
          <span>⚡ 실시간 전술 선택지 (클릭 시 즉시 실행)</span>
          <span class="text-[10px] font-mono text-gray-500">5-Directional Tactical Levers</span>
        </div>
        <div class="grid grid-cols-1 gap-1.5" id="tactical-choices-list">
          <!-- Dynamically populated 5 choices -->
        </div>

        <!-- Free Text Input Form -->
        <form onsubmit="handleSendAction(event)" class="flex gap-2 mt-1">
          <input type="text" id="user-input-box" placeholder='행동(*...*)이나 대사("...")를 입력하세요... (Enter 전송)' class="flex-1 bg-black/60 border border-white/15 focus:border-abyss-accent focus:ring-1 focus:ring-abyss-accent rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 outline-none transition">
          <button type="submit" id="send-action-btn" class="px-5 py-2.5 rounded-xl bg-abyss-accent hover:bg-rose-600 text-white text-sm font-semibold flex items-center gap-1.5 transition shrink-0">
            <span>전송</span>
            <i data-lucide="send" class="w-3.5 h-3.5"></i>
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- 3. Character Creation Modal (최소 단위 생성기) -->
  <div id="create-char-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-abyss-900 rounded-2xl p-6 flex flex-col gap-4 border border-white/15 shadow-2xl">
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="user-plus" class="w-4 h-4 text-abyss-accent"></i>
          <span>새로운 캐릭터 생성</span>
        </h3>
        <button onclick="hideCreateCharacterModal()" class="text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form onsubmit="handleCreateCharacter(event)" class="flex flex-col gap-3">
        <div>
          <label class="text-xs font-semibold text-gray-300 block mb-1">캐릭터 이름</label>
          <input type="text" id="new-char-name" placeholder="예: 벨리아, 세레나" required class="w-full bg-black/50 border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-300 block mb-1">칭호 및 신분</label>
          <input type="text" id="new-char-title" placeholder="예: 암흑 사제 • 그림자 교단" required class="w-full bg-black/50 border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-300 block mb-1">로웬 신체 갑주 유형</label>
          <select id="new-char-armor" class="w-full bg-black/50 border border-white/15 rounded-lg px-3 py-2 text-xs text-white outline-none">
            <option value="Rigid">Rigid (완벽주의 척추 방어)</option>
            <option value="Endurer">Endurer (신체 억압 및 인내)</option>
            <option value="Controller">Controller (상체 팽창 및 지배)</option>
            <option value="Deprived">Deprived (애착 갈망 및 결핍)</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-300 block mb-1">핵심 외형 및 성격 서사</label>
          <textarea id="new-char-traits" rows="3" placeholder="예: 흑발의 단발머리, 붉은 눈동자, 목에 채워진 서늘한 가시 초커, 도도하지만 체온에 취약함" class="w-full bg-black/50 border border-white/15 rounded-lg p-2.5 text-xs text-white outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-white/10">
          <button type="button" onclick="hideCreateCharacterModal()" class="px-4 py-2 rounded-lg text-xs text-gray-400 hover:text-white">취소</button>
          <button type="submit" id="create-char-btn" class="px-5 py-2 rounded-lg bg-abyss-accent hover:bg-rose-600 text-white text-xs font-semibold transition">
            생성 완료
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Controller -->
  <script>
    let characters = [];
    let activeCharacter = null;
    let turnCount = 1;

    async function init() {
      lucide.createIcons();
      await fetchCharacters();
    }

    async function fetchCharacters() {
      try {
        setLoading(true, "캐릭터 목록을 불러오는 중입니다...");
        const res = await fetch('/api/characters');
        const data = await res.json();
        characters = data.characters || [];
        renderCharacterPills();
        if (characters.length > 0) {
          await selectCharacter(characters[0].seed_hash);
        }
      } catch (err) {
        console.error("Fetch characters failed", err);
      } finally {
        setLoading(false);
      }
    }

    function renderCharacterPills() {
      const container = document.getElementById('character-pills-container');
      container.innerHTML = characters.map(c => `
        <button onclick="selectCharacter('${c.seed_hash}')" class="px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 transition ${activeCharacter?.seed_hash === c.seed_hash ? 'bg-abyss-accent text-white shadow-md shadow-abyss-accent/30' : 'bg-white/5 hover:bg-white/10 text-gray-300'}">
          <span>${c.name}</span>
          <span class="text-[10px] opacity-70 font-mono">(${c.armor_type})</span>
        </button>
      `).join('');
    }

    async function selectCharacter(seedHash) {
      activeCharacter = characters.find(c => c.seed_hash === seedHash) || characters[0];
      renderCharacterPills();
      updateCharacterUI();
      await loadSessionChat(activeCharacter.seed_hash);
    }

    function updateCharacterUI() {
      if (!activeCharacter) return;
      document.getElementById('char-name-text').innerText = activeCharacter.name;
      document.getElementById('char-title-text').innerText = `${activeCharacter.title} • ${activeCharacter.faction}`;
      document.getElementById('char-armor-text').innerText = activeCharacter.armor_type;
      document.getElementById('char-seed-badge').innerText = activeCharacter.seed_hash;
      document.getElementById('char-stage-badge').innerText = activeCharacter.stage || "Stage 1 (탄성 저항)";
      
      const ego = activeCharacter.ego_resilience !== undefined ? activeCharacter.ego_resilience : 100.0;
      document.getElementById('ego-val').innerText = `${ego.toFixed(1)}%`;
      document.getElementById('ego-bar-fill').style.width = `${ego}%`;

      if (activeCharacter.image_url) {
        document.getElementById('char-portrait-img').src = activeCharacter.image_url;
      }
    }

    async function loadSessionChat(seedHash) {
      const sessionId = `SESSION_${seedHash}`;
      setLoading(true, `${activeCharacter?.name || '캐릭터'}의 대화 서사를 불러오는 중입니다...`);
      try {
        const histRes = await fetch(`/api/session/${encodeURIComponent(sessionId)}/history`);
        const histData = await histRes.json();
        
        if (histData.turns && histData.turns.length > 0) {
          renderFullChatHistory(histData.turns);
          const lastTurn = histData.turns[histData.turns.length - 1];
          turnCount = lastTurn.step;
          document.getElementById('turn-counter').innerText = `TURN ${lastTurn.step}`;
          if (lastTurn.dynamic_choices) {
            renderChoices(lastTurn.dynamic_choices);
          }
        } else {
          const openRes = await fetch('/api/session/opening', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: sessionId, character_seed: seedHash })
          });
          const openData = await openRes.json();
          renderSinglePrologue(openData.narrative_prose);
          turnCount = openData.step;
          document.getElementById('turn-counter').innerText = `TURN ${openData.step}`;
          if (openData.dynamic_choices) {
            renderChoices(openData.dynamic_choices);
          }
        }
      } catch (err) {
        console.error("Load session chat failed", err);
      } finally {
        setLoading(false);
      }
    }

    function renderSinglePrologue(prose) {
      const stream = document.getElementById('dialogue-stream');
      stream.innerHTML = `
        <div class="p-4 rounded-xl bg-black/40 border border-white/5 text-sm leading-relaxed text-gray-200">
          <div class="text-[11px] font-mono text-abyss-gold font-bold mb-2 flex items-center justify-between">
            <span class="flex items-center gap-1.5"><i data-lucide="book-open" class="w-3.5 h-3.5"></i> PROLOGUE SCENE</span>
            <span class="text-[10px] text-gray-400">TURN 1</span>
          </div>
          <div class="whitespace-pre-wrap font-sans text-gray-200">${prose}</div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderFullChatHistory(turns) {
      const stream = document.getElementById('dialogue-stream');
      stream.innerHTML = turns.map(t => {
        if (t.step === 1 && t.user_action === "[OPENING SCENE]") {
          return `
            <div class="p-4 rounded-xl bg-black/40 border border-white/5 text-sm leading-relaxed text-gray-200">
              <div class="text-[11px] font-mono text-abyss-gold font-bold mb-2 flex items-center justify-between">
                <span class="flex items-center gap-1.5"><i data-lucide="book-open" class="w-3.5 h-3.5"></i> PROLOGUE SCENE</span>
                <span class="text-[10px] text-gray-400">TURN 1</span>
              </div>
              <div class="whitespace-pre-wrap font-sans text-gray-200">${t.narrative_prose}</div>
            </div>
          `;
        }
        return `
          <div class="flex justify-end">
            <div class="max-w-[85%] p-3 rounded-xl bg-abyss-accent/20 border border-abyss-accent/40 text-xs text-white">
              <div class="text-[10px] font-mono text-rose-300 font-bold mb-1">👤 당신의 행동 / 대사 (TURN ${t.step})</div>
              <div>${t.user_action}</div>
            </div>
          </div>
          <div class="p-4 rounded-xl bg-black/40 border border-white/5 text-sm leading-relaxed text-gray-200">
            <div class="text-[11px] font-mono text-abyss-gold font-bold mb-2 flex items-center justify-between">
              <span class="flex items-center gap-1.5"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i> ${activeCharacter?.name || '캐릭터'} • ${activeCharacter?.stage || 'Stage 1'}</span>
              <span class="text-[10px] text-gray-400">TURN ${t.step}</span>
            </div>
            <div class="whitespace-pre-wrap font-sans text-gray-200">${t.narrative_prose}</div>
          </div>
        `;
      }).join('');
      stream.scrollTop = stream.scrollHeight;
      lucide.createIcons();
    }

    async function handleSendAction(e) {
      e.preventDefault();
      const input = document.getElementById('user-input-box');
      const action = input.value.trim();
      if (!action) return;
      input.value = '';
      await executeTurn(action);
    }

    async function selectChoice(action) {
      await executeTurn(action);
    }

    async function executeTurn(userAction) {
      if (!activeCharacter) return;
      setLoading(true, `${activeCharacter.name}이(가) 당신의 행동에 반응하며 고밀도 서사를 집필하는 중입니다...`);

      try {
        const res = await fetch('/api/session/turn', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: `SESSION_${activeCharacter.seed_hash}`,
            character_seed: activeCharacter.seed_hash,
            user_input: userAction
          })
        });
        const data = await res.json();
        
        turnCount = data.step;
        document.getElementById('turn-counter').innerText = `TURN ${data.step}`;
        appendProseToStream(userAction, data.narrative_prose, data.step);

        activeCharacter.stage = data.stage;
        activeCharacter.ego_resilience = data.ego_resilience;
        if (data.image_url) {
          activeCharacter.image_url = data.image_url;
        }
        updateCharacterUI();

        if (data.dynamic_choices && data.dynamic_choices.length > 0) {
          renderChoices(data.dynamic_choices);
        }
      } catch (err) {
        console.error("Turn execution failed", err);
        alert("서사 생성에 실패했습니다. 백엔드 콘솔을 확인해 주세요.");
      } finally {
        setLoading(false);
      }
    }

    function appendProseToStream(action, prose, step) {
      const stream = document.getElementById('dialogue-stream');
      const userBubble = `
        <div class="flex justify-end">
          <div class="max-w-[85%] p-3 rounded-xl bg-abyss-accent/20 border border-abyss-accent/40 text-xs text-white">
            <div class="text-[10px] font-mono text-rose-300 font-bold mb-1">👤 당신의 행동 / 대사 (TURN ${step})</div>
            <div>${action}</div>
          </div>
        </div>
      `;
      const aiBubble = `
        <div class="p-4 rounded-xl bg-black/40 border border-white/5 text-sm leading-relaxed text-gray-200">
          <div class="text-[11px] font-mono text-abyss-gold font-bold mb-2 flex items-center justify-between">
            <span class="flex items-center gap-1.5"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i> ${activeCharacter?.name} • ${activeCharacter?.stage}</span>
            <span class="text-[10px] text-gray-400">TURN ${step}</span>
          </div>
          <div class="whitespace-pre-wrap font-sans text-gray-200">${prose}</div>
        </div>
      `;
      stream.innerHTML += userBubble + aiBubble;
      stream.scrollTop = stream.scrollHeight;
      lucide.createIcons();
    }

    function renderChoices(choices) {
      const container = document.getElementById('tactical-choices-list');
      const colorMap = {
        "DEVOTION": { tag: "text-amber-400", label: "★ 순애", border: "hover:border-amber-400" },
        "SUBJUGATION": { tag: "text-rose-400", label: "■ 지배", border: "hover:border-rose-400" },
        "SEDUCTION": { tag: "text-purple-400", label: "● 관능", border: "hover:border-purple-400" },
        "SUSPENSION": { tag: "text-cyan-400", label: "▲ 굴복/관망", border: "hover:border-cyan-400" },
      };
      container.innerHTML = choices.map(c => {
        const meta = colorMap[c.type] || colorMap["DEVOTION"];
        return `
          <button onclick="selectChoice('${c.action.replace(/'/g, "\\'")}')" class="w-full p-2.5 rounded-lg bg-black/40 hover:bg-white/5 border border-white/10 ${meta.border} text-left flex items-center justify-between transition group">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-mono ${meta.tag} font-bold shrink-0">${meta.label}</span>
              <span class="text-xs text-gray-300 group-hover:text-white line-clamp-1">${c.action}</span>
            </div>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-500 group-hover:text-white shrink-0"></i>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function undoTurn() {
      if (!activeCharacter) return;
      setLoading(true, "직전 턴으로 되돌리는 중입니다...");
      try {
        const res = await fetch('/api/session/undo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: `SESSION_${activeCharacter.seed_hash}` })
        });
        const data = await res.json();
        if (data.success) {
          await loadSessionChat(activeCharacter.seed_hash);
        } else {
          alert(data.message || "되돌릴 턴이 없습니다.");
        }
      } catch (err) {
        console.error("Undo error", err);
      } finally {
        setLoading(false);
      }
    }

    function setLoading(isLoading, message = "") {
      const bar = document.getElementById('loading-feedback-bar');
      const text = document.getElementById('loading-feedback-text');
      const input = document.getElementById('user-input-box');
      const sendBtn = document.getElementById('send-action-btn');

      if (isLoading) {
        text.innerText = message || "처리 중입니다...";
        bar.classList.remove('hidden');
        input.disabled = true;
        sendBtn.disabled = true;
      } else {
        bar.classList.add('hidden');
        input.disabled = false;
        sendBtn.disabled = false;
      }
    }

    // Modal controls
    function showCreateCharacterModal() {
      document.getElementById('create-char-modal').classList.remove('hidden');
    }
    function hideCreateCharacterModal() {
      document.getElementById('create-char-modal').classList.add('hidden');
    }
    async function handleCreateCharacter(e) {
      e.preventDefault();
      const name = document.getElementById('new-char-name').value.trim();
      const title = document.getElementById('new-char-title').value.trim();
      const armor = document.getElementById('new-char-armor').value;
      const traits = document.getElementById('new-char-traits').value.trim();
      if (!name) return;

      hideCreateCharacterModal();
      setLoading(true, `새로운 캐릭터 [${name}]을(를) 생성하고 서사를 초기화하는 중입니다...`);

      try {
        const res = await fetch('/api/characters/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, title, armor_type: armor, traits })
        });
        const newChar = await res.json();
        await fetchCharacters();
        await selectCharacter(newChar.seed_hash);
      } catch (err) {
        console.error("Create character error", err);
        alert("캐릭터 생성에 실패했습니다.");
      } finally {
        setLoading(false);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
